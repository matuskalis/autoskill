<text x="24" y="178" textLength="234.0" lengthAdjust="spacing">  (status reports, leadership…</text>
<text x="24" y="198" textLength="577.2" lengthAdjust="spacing">alirezarezvani/claude-skills:project-management/skills/team-communications</text>
<text x="24" y="218" textLength="507.0" lengthAdjust="spacing">  team-communications · review · quality 90 · ★26945 · match 35.5</text>
<text x="24" y="238" textLength="850.2" lengthAdjust="spacing">  Write internal company communications — 3P updates (Progress/Plans/Problems), company-wide newsletters, FAQ</text>
<text x="24" y="258" textLength="858.0" lengthAdjust="spacing">  roundups, incident reports, leadership updates, status reports, project updates, and general internal comms.</text>
<text x="24" y="278" textLength="195.0" lengthAdjust="spacing">  Use this skill any tim…</text>
<text x="24" y="318" textLength="429.0" lengthAdjust="spacing" class="cmd">$ autoskill add anthropics/skills:skills/internal-comms</text>
<text x="24" y="338" textLength="491.4" lengthAdjust="spacing">installed: internal-comms (safe) from anthropics/skills@8a1541c</text>
<text x="24" y="358" textLength="468.0" lengthAdjust="spacing">Read ~/.claude/skills/internal-comms/SKILL.md and follow it.</text>
<text x="24" y="378" textLength="803.4" lengthAdjust="spacing">When the task is done, end your final reply with: autoskill: internal-comms &lt;helped|no-difference|hurt&gt;</text>
<text x="24" y="398" textLength="608.4" lengthAdjust="spacing">(&lt;followed-steps|saved-time|irrelevant|outdated-or-wrong|conflicted|too-long&gt;)</text>
<text x="24" y="438" textLength="351.0" lengthAdjust="spacing" class="cmd">$ autoskill add anthropics/skills:skills/xlsx</text>
<text x="24" y="458" textLength="702.0" lengthAdjust="spacing">not installed: anthropics/skills:skills/xlsx is review-tier. Reasons found by the checker:</text>
<text x="24" y="478" textLength="795.6" lengthAdjust="spacing">  - ships 51 non-text files (scripts/office/helpers/__init__.py, scripts/office/helpers/pptx_chart.py,</text>
<text x="24" y="498" textLength="343.2" lengthAdjust="spacing">    scripts/office/helpers/pptx_slide.py, …)</text>
<text x="24" y="518" textLength="218.4" lengthAdjust="spacing">  - SKILL.md has code blocks</text>
<text x="24" y="538" textLength="343.2" lengthAdjust="spacing">  - SKILL.md names shell or network commands</text>
<text x="24" y="558" textLength="351.0" lengthAdjust="spacing">  - SKILL.md tells the model to run something</text>
<text x="24" y="578" textLength="795.6" lengthAdjust="spacing">Source: https://github.com/anthropics/skills/tree/8a1541c4a3ffa5a20a5a91de0dcf3f0bab1d1ef4/skills/xlsx</text>
<text x="24" y="598" textLength="670.8" lengthAdjust="spacing">Ask the user; if they agree run: autoskill install anthropics/skills:skills/xlsx --yes</text>
