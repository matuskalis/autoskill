name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest line the README promises (22.18 and newer run TypeScript natively).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/bench-hook.ts --check
      - name: First run of the CLI on a clean checkout, in an empty home directory
        env:
          HOME: ${{ runner.temp }}/home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/home/.claude
          AUTOSKILL_HOME: ${{ runner.temp }}/home/.autoskill
        run: |
          mkdir -p "$HOME"
          node src/cli.ts search "merge two pdf files" --limit 2 | tee "$RUNNER_TEMP/search.txt"
          grep -q "third-party text" "$RUNNER_TEMP/search.txt"
          node src/cli.ts list
          node src/cli.ts doctor
